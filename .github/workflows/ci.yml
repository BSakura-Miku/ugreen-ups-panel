name: Verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r requirements.lock -r requirements-dev.txt
      - run: python scripts/check-public.py --require-git
      - run: python -m pytest -q
      - run: for script in scripts/*.sh; do sh -n "$script"; done
      - run: npm ci && npm run build && npm audit
        working-directory: frontend
      - name: Validate Compose and the dashboard image
        run: |
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.build.yaml config --quiet
          docker build -t ugreen-ups-panel:ci .
          python scripts/smoke-image.py --image ugreen-ups-panel:ci --platform linux/amd64
      - name: Validate host collector commands
        run: |
          python -S -m ups_panel.collector --help
          python -S scripts/collector-admin.py --help
