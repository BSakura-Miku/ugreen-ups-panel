name: ugreen-ups-panel

services:
  panel:
    image: bsakuramiku/ugreen-ups-panel:latest
    restart: unless-stopped
    ports:
      - "9086:8080"
    environment:
      UPS_SNAPSHOT: /capture/latest.json
      UPS_DATABASE: /data/history.sqlite
      TZ: Asia/Shanghai
    volumes:
      - type: bind
        source: /run/ugreen-ups-panel
        target: /capture
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./data
        target: /data
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 0.50
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
