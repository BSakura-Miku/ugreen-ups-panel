services:
  panel:
    build: .
    image: ugreen-ups-panel:0.3.0
    restart: unless-stopped
    ports:
      - "${UPS_BIND_IP:-127.0.0.1}:${UPS_PORT:-9086}:8080"
    environment:
      UPS_SNAPSHOT: /capture/latest.json
      UPS_DATABASE: /data/history.sqlite
      TZ: ${TZ:-UTC}
    volumes:
      - type: bind
        source: /run/ugreen-ups-panel
        target: /capture
        read_only: true
        bind:
          create_host_path: false
      - panel-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 0.50
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
volumes:
  panel-data:
