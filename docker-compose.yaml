services:
  panel:
    image: bsakuramiku/ugreen-ups-panel:latest
    restart: unless-stopped # NAS 重启后自动启动，手动停止后保持停止
    ports:
      - "9086:8080" # 访问 NAS_IP:9086；更换访问端口只改左侧
    volumes:
      # 宿主机采集器输出，只读挂载给面板
      - /run/ugreen-ups-panel:/run/ugreen-ups-panel:ro
      # 历史数据库保存在当前目录，更新容器时保留
      - ./data:/data
